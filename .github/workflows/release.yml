name: Build Windows Installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: MOD Loader version without the v prefix
        required: true
        default: "0.1.1"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out release repository
        uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            "${{ inputs.version }}"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Check out OpenCode source
        shell: pwsh
        run: |
          git clone https://github.com/UR-xiaoyang/opencode.git opencode
          git -C opencode checkout 5e5cc924b8b1d1c5348309d2b23dbc59c72d27d2

      - name: Apply MOD Loader patch
        shell: pwsh
        run: |
          git -C opencode apply --check "$env:GITHUB_WORKSPACE\patches\opencode-mod-loader.patch"
          git -C opencode apply "$env:GITHUB_WORKSPACE\patches\opencode-mod-loader.patch"

      - name: Install dependencies
        shell: pwsh
        working-directory: opencode
        run: bun install --frozen-lockfile

      - name: Build Windows installer
        shell: pwsh
        working-directory: opencode\packages\desktop
        run: |
          $env:OPENCODE_CHANNEL = "prod"
          bun run build
          bun run package:win

      - name: Prepare release assets
        shell: pwsh
        run: |
          $installer = "opencode\packages\desktop\dist\opencode-desktop-win-x64.exe"
          $asset = "opencode-desktop-mod-loader-v$env:VERSION-win-x64.exe"
          Copy-Item $installer $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash
          "$hash  $asset" | Set-Content -NoNewline "SHA256SUMS-v$env:VERSION.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mod-loader-v${{ env.VERSION }}-windows
          path: |
            opencode-desktop-mod-loader-v${{ env.VERSION }}-win-x64.exe
            SHA256SUMS-v${{ env.VERSION }}.txt
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" `
            --target "$env:GITHUB_SHA" `
            --title "MOD Loader v$env:VERSION" `
            --generate-notes `
            "opencode-desktop-mod-loader-v$env:VERSION-win-x64.exe" `
            "SHA256SUMS-v$env:VERSION.txt"
