name: Release MOD Loader

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: MOD Loader version without the v prefix
        required: true
        default: "0.3.7"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out MOD Loader source
        uses: actions/checkout@v4

      - name: Set release version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            "${{ inputs.version }}"
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Check out OpenCode base
        shell: pwsh
        run: |
          $manifest = Get-Content "mod-loader.json" | ConvertFrom-Json
          git clone $manifest.upstream opencode
          git -C opencode checkout $manifest.baseCommit

      - name: Generate and validate MOD Loader patch
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "src"
          $upstream = Join-Path $env:GITHUB_WORKSPACE "opencode"
          $patch = Join-Path $env:GITHUB_WORKSPACE "opencode-mod-loader.patch"
          Copy-Item (Join-Path $source "*") $upstream -Recurse -Force
          git -C $upstream add -A
          git -C $upstream diff --cached --binary HEAD -- . > $patch
          git -C $upstream reset --hard HEAD
          git -C $upstream clean -fd
          git -C $upstream apply --check $patch
          git -C $upstream apply $patch

      - name: Install dependencies
        shell: pwsh
        working-directory: opencode
        run: bun install --frozen-lockfile

      - name: Build Windows installer
        shell: pwsh
        working-directory: opencode\packages\desktop
        run: |
          $env:OPENCODE_CHANNEL = "prod"
          $env:NODE_OPTIONS = "--max-old-space-size=4096"
          bun run build
          bun run package:win -- --publish never

      - name: Prepare release assets
        shell: pwsh
        run: |
          $installer = "opencode\packages\desktop\dist\opencode-desktop-win-x64.exe"
          $asset = "opencode-desktop-mod-loader-v$env:VERSION-win-x64.exe"
          Copy-Item $installer $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash
          "$hash  $asset" | Set-Content -NoNewline "SHA256SUMS-v$env:VERSION.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mod-loader-v${{ env.VERSION }}-windows
          path: |
            opencode-desktop-mod-loader-v${{ env.VERSION }}-win-x64.exe
            opencode-mod-loader.patch
            SHA256SUMS-v${{ env.VERSION }}.txt
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" `
            --target "$env:GITHUB_SHA" `
            --title "MOD Loader v$env:VERSION" `
            --generate-notes `
            "opencode-desktop-mod-loader-v$env:VERSION-win-x64.exe" `
            "opencode-mod-loader.patch" `
            "SHA256SUMS-v$env:VERSION.txt"
