name: Bug Report CI Check

on:
  issues:
    types: [opened, edited]

jobs:
  check-bug-report:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'bug')
    steps:
      - name: Check Bug Report Completeness
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const requiredSections = [
              'Bug Description',
              'To Reproduce',
              'Expected Behavior',
              'Environment'
            ];

            const missingSections = requiredSections.filter(section =>
              !body.includes(section)
            );

            if (missingSections.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `👋 Thank you for reporting this issue!\n\nIt looks like your bug report is missing the following sections:\n${missingSections.map(s => `- ${s}`).join('\n')}\n\nPlease update your issue to include these sections. This helps us address the bug more quickly.`
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs-more-info']
              });
            }
