name: Greet New Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Greet First Time Contributors
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 Welcome to the OpenCode MOD Loader community!

            Thank you for opening your first issue. A maintainer will review it soon.

            While you wait:
            - Check out our [Community Guidelines](https://github.com/UR-xiaoyang/opencode-mod-loader/blob/main/COMMUNITY_GUIDELINES.md)
            - Browse [existing discussions](https://github.com/UR-xiaoyang/opencode-mod-loader/discussions)
            - See [how to contribute](https://github.com/UR-xiaoyang/opencode-mod-loader/blob/main/CONTRIBUTING.md)

          pr-message: |
            👋 Welcome and thank you for your first contribution!

            A maintainer will review your pull request soon. Please make sure:
            - [ ] Your code follows our [coding standards](https://github.com/UR-xiaoyang/opencode-mod-loader/blob/main/CONTRIBUTING.md#coding-standards)
            - [ ] Tests pass
            - [ ] Documentation is updated

            Need help? Feel free to ask questions in the PR comments.
