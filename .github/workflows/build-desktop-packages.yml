name: Build Desktop Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: MOD Loader release version without the v prefix; the OpenCode version is appended automatically
        required: true
        default: "0.3.6"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-latest
            package: win
            extensions: '(".exe")'
          - name: Linux
            runner: ubuntu-latest
            package: linux
            extensions: '(".AppImage", ".deb", ".rpm")'
          - name: macOS
            runner: macos-latest
            package: mac
            extensions: '(".dmg", ".zip")'

    steps:
      - name: Check out MOD Loader source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Check out OpenCode base
        shell: pwsh
        run: |
          $manifest = Get-Content "mod-loader.json" | ConvertFrom-Json
          git clone $manifest.upstream opencode
          git -C opencode checkout $manifest.baseCommit

      - name: Apply MOD Loader overlay
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "src"
          $upstream = Join-Path $env:GITHUB_WORKSPACE "opencode"
          $patch = Join-Path $env:GITHUB_WORKSPACE "opencode-mod-loader.patch"
          Copy-Item (Join-Path $source "*") $upstream -Recurse -Force
          git -C $upstream add -A
          git -C $upstream diff --cached --binary HEAD -- . > $patch
          git -C $upstream reset --hard HEAD
          git -C $upstream clean -fd
          git -C $upstream apply --check $patch
          git -C $upstream apply $patch

      - name: Install dependencies
        shell: pwsh
        working-directory: opencode
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            bun install --frozen-lockfile
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt 3) {
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          exit 1

      - name: Build package
        shell: pwsh
        working-directory: opencode/packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          bun run build
          bun run package:${{ matrix.package }} -- --publish never

      - name: Collect installers
        shell: pwsh
        run: |
          $extensions = @${{ matrix.extensions }}
          $output = Join-Path $env:GITHUB_WORKSPACE "release-artifacts"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $packages = Get-ChildItem "opencode/packages/desktop/dist" -File |
            Where-Object { $_.Extension -in $extensions }
          if ($packages.Count -eq 0) {
            throw "No installer artifacts were produced."
          }
          $packages | ForEach-Object {
            Copy-Item $_.FullName -Destination $output
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mod-loader-${{ matrix.package }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out MOD Loader source
        uses: actions/checkout@v4

      - name: Download desktop packages
        uses: actions/download-artifact@v4
        with:
          pattern: opencode-mod-loader-*
          merge-multiple: true
          path: release-artifacts

      - name: Generate and validate MOD Loader patch
        shell: pwsh
        run: |
          $manifest = Get-Content "mod-loader.json" | ConvertFrom-Json
          $source = Join-Path $env:GITHUB_WORKSPACE "src"
          $upstream = Join-Path $env:GITHUB_WORKSPACE "opencode"
          $patch = Join-Path $env:GITHUB_WORKSPACE "release-artifacts/opencode-mod-loader.patch"
          git clone $manifest.upstream $upstream
          git -C $upstream checkout $manifest.baseCommit
          Copy-Item (Join-Path $source "*") $upstream -Recurse -Force
          git -C $upstream add -A
          git -C $upstream diff --cached --binary HEAD -- . > $patch
          git -C $upstream reset --hard HEAD
          git -C $upstream clean -fd
          git -C $upstream apply --check $patch

      - name: Generate checksums
        shell: pwsh
        run: |
          $checksums = Get-ChildItem "release-artifacts" -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksums | Set-Content "release-artifacts/SHA256SUMS.txt"

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content "mod-loader.json" | ConvertFrom-Json
          $tag = "v${{ inputs.version }}-opencode-$($manifest.upstreamVersion)"
          $assets = Get-ChildItem "release-artifacts" -File | ForEach-Object { $_.FullName }
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag `
              --target "$env:GITHUB_SHA" `
              --title "MOD Loader v${{ inputs.version }} (OpenCode v$($manifest.upstreamVersion))" `
              --generate-notes `
              @assets
          }
